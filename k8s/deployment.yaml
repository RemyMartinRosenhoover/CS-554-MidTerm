apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs554-midterm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cs554-midterm
  template:
    metadata:
      labels:
        app: cs554-midterm
        tier: web
    spec:
      containers:
        - name: web
          image: cs554-midterm:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: SERVICE_NAME
              value: cs554-k8s
            - name: MESSAGE
              value: Hello from Kubernetes inside the VM
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 2
            successThreshold: 1
